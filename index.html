<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1e88e5">
  <meta name="description" content="Vejret der hvor du er, med 5 dages udsigt og time for time.">
  <title>Vejr App</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="loader" aria-hidden="true">
    <div class="loader-sun"></div>
    <div class="loader-cloud"></div>
    <p class="loader-text">Henter vejret...</p>
  </div>

  <div id="weather-fx" aria-hidden="true"></div>

  <!-- halloween-knappen vises kun i oktober -->
  <button id="halloween-toggle" type="button" aria-pressed="false" hidden>🎃 Halloween</button>

  <div id="halloween-decor" aria-hidden="true">
    <span class="pumpkin left" style="top: 15%">🎃</span>
    <span class="pumpkin left" style="top: 50%; animation-delay: -1s">🎃</span>
    <span class="pumpkin left" style="top: 82%; animation-delay: -2s">🎃</span>
    <span class="pumpkin right" style="top: 25%; animation-delay: -0.5s">🎃</span>
    <span class="pumpkin right" style="top: 60%; animation-delay: -1.5s">🎃</span>
    <span class="pumpkin right" style="top: 88%; animation-delay: -2.5s">🎃</span>
  </div>

  <h1 id="title">Vejr i Aalborg</h1>

  <p id="status" aria-live="polite"></p>

  <main id="app"></main>

  <footer>Data fra <a href="https://open-meteo.com/">Open-Meteo.com</a></footer>

  <script type="module" src="js/main.js"></script>

</body>
</html>
